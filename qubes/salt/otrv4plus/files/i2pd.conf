##
## i2pd in sys-i2p: a router, and SAM on this qube's loopback. Nothing else
## listens: no web console, no HTTP/SOCKS proxy, no BOB, I2CP or I2PControl.
## The chat qube reaches SAM through qrexec (policy 30-otrv4plus.policy).
log = syslog
loglevel = warn
ipv4 = true
ipv6 = false
bandwidth = O
notransit = false
floodfill = false

[ntcp2]
enabled = true

[ssu2]
enabled = true

[http]
enabled = false

[httpproxy]
enabled = false

[socksproxy]
enabled = false

[sam]
enabled = true
address = 127.0.0.1
port = 7656
portudp = 7655

[bob]
enabled = false

[i2cp]
enabled = false

[i2pcontrol]
enabled = false

[upnp]
enabled = false

[reseed]
verify = true

[addressbook]
enabled = true
