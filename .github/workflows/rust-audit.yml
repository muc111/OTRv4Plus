#
# RustSec advisory audit of Rust/Cargo.lock.
#
# `--deny warnings`: every advisory against a locked crate fails the job
# unless Rust/.cargo/audit.toml names it with a reason.
#
# WHEN IT RUNS
# On a change to a manifest, a lock file or an ignore list. The list is
# written once and used for a push and a pull request alike (they had
# drifted: a pull request touching Rust/mls/Cargo.toml, or this file, ran
# no audit). A change to anything else matches nothing and pays nothing.
#
# Weekly as well, because advisories arrive against code that has not
# moved. The weekly run audits `main` AND `dev`: a scheduled workflow only
# ever runs from the default branch, and `dev` is where a new dependency
# lands first and what the test builds are made from. With `main` alone,
# an advisory against a crate that only `dev` had locked went unreported
# until the next push that happened to touch a lock file.
name: Rust audit

on:
  push:
    branches: [main, dev, "claude/**"]
    paths: &audited
      - "Rust/Cargo.toml"
      - "Rust/Cargo.lock"
      - "Rust/.cargo/audit.toml"
      - "Rust/mls/Cargo.toml"
      - "Rust/mls/Cargo.lock"
      - "Rust/mls/.cargo/audit.toml"
      - ".github/workflows/rust-audit.yml"
  pull_request:
    paths: *audited
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (RustSec)${{ matrix.ref && format(' on {0}', matrix.ref) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The weekly run: both branches. Otherwise the commit that
        # triggered the run ("" is what actions/checkout does by default).
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["main", "dev"]' || '[""]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2
      - name: Install cargo-audit 0.22.2
        run: command -v cargo-audit || cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust/Cargo.lock against the RustSec database
        working-directory: Rust
        run: cargo audit --deny warnings

      # The lock the MLS crate's own tests build against. Its ignores are
      # the same decisions as the core's (Rust/mls/.cargo/audit.toml).
      - name: Audit Rust/mls/Cargo.lock
        working-directory: Rust/mls
        run: cargo audit --deny warnings

      # Every ignore above says "locked, not built". Checked, not trusted:
      # each crate an ignore names must be absent from the shipped build
      # (the APK's features), or the job fails. ml-kem is the
      # control -- it IS in the build, so an empty answer means absent, not
      # a broken query.
      - name: Ignored advisories are not in the shipped build
        working-directory: Rust
        run: |
          set -eu
          test -n "$(cargo tree -e all --features mls,android-opus --target all -i ml-kem 2>/dev/null)"
          for c in crypto-bigint@0.5.5 libcrux-kem libcrux-hmac-drbg libsqlite3-sys proc-macro-error2; do
            out=$(cargo tree -e all --features mls,android-opus --target all -i "$c" 2>/dev/null || true)
            if [ -n "$out" ]; then
              echo "::error::$c is in the shipped build, so its ignore is wrong"
              echo "$out"
              exit 1
            fi
          done
