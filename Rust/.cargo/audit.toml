# Location matters: cargo-audit reads .cargo/audit.toml. This file used to sit
# at Rust/audit.toml, where it was never read -- its ignores never applied.
# cargo-audit configuration for otrv4_core. CI runs `cargo audit --deny warnings`
# (.github/workflows/rust-audit.yml), so every entry below is a decision, and
# any advisory NOT listed here fails the build.
#
# Audited 2026-09-24 with cargo-audit 0.22.2 against the RustSec advisory
# database (1267 advisories): 0 vulnerabilities in 134 locked crates.
# Re-audited 2026-09-28 after linking otrv4-mls (1273 advisories, 333 locked
# crates across all targets): 0 vulnerabilities; one new unmaintained
# compile-time crate, below.
# Re-audited 2026-10-11 after `cargo update` and openmls 0.9.1: three new
# advisories, all in libcrux crates that are locked but never compiled
# (below).
#
# The two pyo3 entries that used to be here (RUSTSEC-2025-0020,
# RUSTSEC-2026-0177) were removed: neither matches the locked pyo3 0.29.2, and a
# stale ignore would silently hide a future advisory with the same ID.
[advisories]
ignore = [
  # UNMAINTAINED, not vulnerable: the upstream PQClean project is being
  # archived, so these crates will receive no further updates. They are the
  # ML-KEM-1024 (FIPS 203) and ML-DSA-87 (FIPS 204) implementations every PQ
  # operation in the protocol runs on; replacing them is a change of
  # cryptographic implementation (candidate: libcrux or RustCrypto ml-kem /
  # ml-dsa), to be done as its own reviewed change with known-answer and
  # cross-implementation tests (tests/test_mlkem_cross_implementation.py), not
  # as a dependency bump. Recorded in docs/LICENSING_AUDIT.md and
  # docs/CRYPTO_SOURCE_OF_TRUTH.md. Revisit on any new advisory against them.
  "RUSTSEC-2026-0161",  # pqcrypto-mlkem 0.1.1
  "RUSTSEC-2026-0162",  # pqcrypto-traits 0.3.5
  "RUSTSEC-2026-0163",  # pqcrypto-internals 0.2.11
  "RUSTSEC-2026-0166",  # pqcrypto-mldsa 0.1.2
  # UNMAINTAINED proc-macro, compile time only, pulled in by pqcrypto-mldsa.
  # Leaves with it.
  "RUSTSEC-2024-0436",  # paste 1.0.15
  # UNMAINTAINED proc-macro, compile time only. In Cargo.lock, NOT in the
  # build: openmls 0.9's optional reference providers (openmls_rust_crypto,
  # openmls_libcrux_crypto) -> hpke-rs -> libcrux-sha3 -> hax-lib ->
  # hax-lib-macros -> proc-macro-error2. Cargo.lock is feature-independent,
  # so optional dependencies are locked even though the `mls` feature never
  # enables them; `cargo tree -e normal --features mls --target all` shows
  # none of these crates. otrv4-mls implements HPKE itself (src/hpke.rs).
  "RUSTSEC-2026-0173",  # proc-macro-error2 2.0.1
  # PANICS ON SHORT INPUT, in code that is NOT BUILT (audited 2026-10-11).
  # libcrux-kem 0.0.9 and libcrux-hmac-drbg 0.0.1 are locked only because
  # openmls 0.9.1 lists its optional libcrux provider (openmls_libcrux_crypto
  # -> hpke-rs-libcrux, which pins libcrux-kem =0.0.9, so `cargo update`
  # cannot move it). The provider is never enabled: otrv4-mls depends on
  # openmls with default-features = false and implements HPKE and its
  # provider itself (mls/src/hpke.rs, mls/src/provider.rs). `cargo tree
  # -e all --target all -i libcrux-kem` prints nothing, for the shipped
  # build and for tests alike. Remove these when openmls moves to a fixed
  # libcrux (0.0.10 / 0.0.2).
  "RUSTSEC-2026-0329",  # libcrux-hmac-drbg 0.0.1
  "RUSTSEC-2026-0330",  # libcrux-kem 0.0.9
  "RUSTSEC-2026-0331",  # libcrux-kem 0.0.9
  # TIMING VARIABILITY in crypto-bigint 0.5 (subtraction, division, Montgomery
  # multiplication), FIXED IN WHAT WE BUILD (2026-10-25). The SMP's
  # constant-time modexp (src/smp.rs) moved to crypto-bigint 0.7.8 and Ed448
  # (src/ring_sig.rs, src/dake.rs, mls/src/provider.rs) to
  # ed448-goldilocks-plus 0.18.1, which is on 0.7 too; values are pinned by
  # smp::tests::mod_exp_matches_reference_* and ring_sig::cross_version.
  # 0.5.5 stays in Cargo.lock only through openmls 0.9's optional reference
  # providers (openmls_rust_crypto, hpke-rs-rust-crypto,
  # openmls_basic_credential -> p256/p384/k256 -> elliptic-curve 0.13), never
  # enabled, as for the libcrux entries above: `cargo tree -e all --features
  # mls --target all -i crypto-bigint@0.5.5` prints nothing. Remove when
  # openmls moves those providers to elliptic-curve 0.14.
  "RUSTSEC-2026-0387",  # crypto-bigint 0.5.5 (locked, not built)
]
