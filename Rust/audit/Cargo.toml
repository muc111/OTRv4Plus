# Differential tests for the post-quantum primitives the core ships
# (audit 2026-09). Not part of any build; nothing depends on it.
#
#   cd Rust/audit && cargo test --release
#
# The core now uses the pure-Rust RustCrypto ml-kem / ml-dsa. This harness
# keeps the old PQClean bindings (pqcrypto-mlkem / pqcrypto-mldsa) as a
# dev-only cross-check and proves the two agree byte for byte: same keys,
# cross encapsulation and signing, and FIPS 203 implicit rejection on
# tampered ciphertexts, which a KAT file does not exercise from the other
# side. That equivalence is what made the migration safe; nothing here is
# shipped (this crate is not a workspace member and nothing depends on it).
[package]
name = "otrv4-core-audit"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-only OR LicenseRef-OTRv4Plus-Commercial"

[dependencies]

[dev-dependencies]
pqcrypto-mlkem  = "=0.1.1"
pqcrypto-mldsa  = "=0.1.2"
pqcrypto-traits = "0.3"
ml-kem = "=0.3.2"
ml-dsa = "=0.1.1"
rand   = "0.8"
# NIST ACVP vectors (tests/acvp_*.rs): JSON, hex, and SHA3-256 of large
# expected outputs. sha3 0.12 is the version the core already locks.
serde_json = "1"
hex        = "0.4"
sha3       = "0.12"
otrv4_core = { path = ".." }

[workspace]
members = ["."]
