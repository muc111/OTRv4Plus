[package]
name        = "otrv4_core"
version     = "0.10.21"
edition     = "2021"
authors     = ["OTRv4+ contributors"]
description = "Post-quantum OTRv4 cryptographic core (Rust/PyO3)"
license     = "GPL-3.0"
# The 1.80 in the source comments is the *language* floor (std::sync::LazyLock
# in smp.rs).  The real floor is the dependency tree, and it is 1.85:
#   * pqcrypto-mlkem / pqcrypto-mldsa build scripts emit
#     `cargo::rustc-check-cfg=...`, which needs cargo >= 1.77;
#   * base64ct 1.8, zeroize 1.9, getrandom 0.3 and wasip2 are edition2024,
#     which needs cargo >= 1.85.
# Measured, not guessed: cargo 1.75 cannot even resolve the graph.  Declaring
# 1.80 here would let a 1.80-1.84 toolchain start a build that fails much
# later with an unrelated-looking error.
rust-version = "1.85"

[lib]
name = "otrv4_core"
# rlib added alongside cdylib.  cdylib alone builds the .so Python loads, but
# it cannot be linked by anything else — so no integration test under tests/
# can ever `use otrv4_core::...`.  Adding rlib costs one extra artifact in
# target/ and nothing at runtime.
crate-type = ["cdylib", "rlib"]

[features]
# CHANGED, AND IT CHANGES YOUR BUILD COMMAND.
#
#     wheel / .so : cargo build --release --features extension-module
#     unit tests  : cargo test
#
# `pyo3/extension-module` tells PyO3 not to link against libpython, which is
# correct when the artifact is a Python extension (the interpreter supplies
# the symbols) and fatal for anything else.  With it in `default`, `cargo
# test` builds a standalone test binary that references Py_None,
# PyErr_SetString and friends with nothing to resolve them against, and the
# link fails.  That is why the #[cfg(test)] modules in aead.rs and mlkem.rs
# have never been able to run.  Making the feature opt-in is PyO3's own
# documented resolution.
default          = ["pq-rust"]
extension-module = ["pyo3/extension-module"]

pq-rust = [
    "num-bigint",
    "num-traits",
    "crypto-bigint",
    "pqcrypto-mlkem",
    "pqcrypto-mldsa",
    "pqcrypto-traits",
    "x448",
    "getrandom",
    "ed448-goldilocks-plus",
]

# v10.6.18.1: declared so rustc stops emitting unexpected_cfgs warnings
# for the #[cfg(feature = "test-only-kdf")] blocks in kdf.rs, header.rs,
# and smp_vault.rs.  These blocks expose PyO3 entry points to crate
# internals (raw KDF, ratchet header encoder, vault secret read-back)
# that are NEVER safe in a production build — they would let Python
# extract SMP secrets from the vault, breaking the security boundary
# the gates enforce.  The feature is OFF by default and is opted-in
# only for Python-side internals tests via:
#   cargo build --release --features extension-module,test-only-kdf
# Do not add this to `default` or `pq-rust`.
#
# The comment above is the only thing that has ever enforced that.  Add this
# to lib.rs so it is enforced by the compiler instead:
#
#   #[cfg(all(feature = "test-only-kdf", feature = "extension-module"))]
#   compile_error!(
#       "test-only-kdf exposes SMP vault secrets to Python and must never be \
#        combined with extension-module: that combination is a shippable \
#        wheel with the test gates open."
#   );
#
# It then becomes impossible to build a distributable artifact with the
# gates open, rather than merely inadvisable.
test-only-kdf = []

[dependencies]
pyo3         = { version = "0.24", features = ["abi3-py39"] }
zeroize      = { version = "1.8",  features = ["derive", "alloc"] }
aes-gcm      = { version = "0.10", features = ["aes"] }
sha3         = { version = "0.10" }
hmac         = { version = "0.12" }
subtle       = { version = "2.5"  }
rand_core    = { version = "0.6"  }
rand         = { version = "0.8"  }
dashmap      = { version = "5.5"  }
thiserror    = { version = "1.0"  }
libc         = { version = "0.2"  }

# Optional, gated by the pq-rust feature.
# v10.6.14: lazy_static (1.5) removed; SMP constants migrated to
#          std::sync::LazyLock (stabilised Rust 1.80).  MSRV is 1.80+.
# v10.6.16: pqcrypto-kyber (round-3 Kyber) replaced by pqcrypto-mlkem
#          (FIPS 203 ML-KEM-1024).  API is drop-in compatible; wire
#          format differs in domain-separator constants.
num-bigint    = { version = "0.4",   optional = true, features = ["rand"] }
num-traits    = { version = "0.2",   optional = true }
# v10.7.6 (Phase 5.4): constant-time modular exponentiation for SMP.
# Already present transitively (pulled in by the pqcrypto stack); promoted to
# a direct dependency here.  0.5.x is the version already resolved in the
# tree, so this adds no new compile.  DynResidue gives constant-time modpow,
# closing the num-bigint modpow timing side-channel in the SMP ZKPs.
crypto-bigint = { version = "0.5",   optional = true }
getrandom     = { version = "0.2",   optional = true }
x448          = { version = "0.6",   optional = true }

pqcrypto-mlkem  = { version = "0.1.1", optional = true, default-features = false, features = ["std"] }
pqcrypto-mldsa  = { version = "0.1.2", optional = true, default-features = false, features = ["std"] }
pqcrypto-traits = { version = "0.3",   optional = true }

ed448-goldilocks-plus = {
    version          = "0.16",
    optional         = true,
    default-features = false,
    features         = ["alloc", "signing", "pkcs8"],
}

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
# panic = "abort" combined with overflow-checks = true means any arithmetic
# overflow on attacker-influenced input aborts the whole Python process
# rather than raising a Python exception.  For a crypto core that is a
# defensible fail-closed choice — a wrapped counter is worse than a crash —
# but it is a remote-DoS surface, so it should be a decision rather than a
# default.  Keeping it: a panic here means an invariant this code depends on
# has already been violated.
panic           = "abort"
overflow-checks = true

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[dev-dependencies]
# Property-based testing for the parts where hand-written cases are weakest:
# SMP transcript encoding, ratchet header round-trips, and the KDF's
# length-prefixing.  Add as you write them; declaring it here costs nothing
# until a test uses it.
proptest = "1"
hex      = "0.4"
