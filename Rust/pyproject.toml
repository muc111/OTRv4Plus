[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "otrv4_core"
version = "0.10.23"
description = "OTRv4+ double ratchet core (Rust)"
# The Rust extension itself is abi3-py39 and would load on 3.9, but the
# OTRv4+ application layer it exists to serve does NOT: otrv4+.py uses PEP 701
# f-string syntax (f"{x !r }") that does not parse before 3.12.  Declaring 3.9
# here let an unsupported interpreter install the wheel and then fail with a
# SyntaxError deep inside an import, which is a confusing way to learn this.
requires-python = ">=3.12"

[tool.maturin]
features = ["pyo3/extension-module"]
