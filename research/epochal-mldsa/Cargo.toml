[package]
name = "epochal-mldsa"
version = "0.0.1"
edition = "2021"
publish = false
license = "AGPL-3.0-only OR LicenseRef-OTRv4Plus-Commercial"
description = "Research prototype: epochal ML-DSA-87 signatures for OTRv4Plus (see ANALYSIS.md). Not part of any release."

# Standalone: not a member of the Rust/ workspace, not built by CI.
[workspace]

[dependencies]
ml-dsa = { version = "=0.1.1", features = ["zeroize"] }
sha3 = "0.10"
getrandom = "0.2"
zeroize = "1"

[dev-dependencies]
# The evidence (tests/conformance.rs, tests/proofs.rs, tests/properties.rs):
# NIST ACVP vectors are JSON; PQClean is an implementation independent of
# RustCrypto's, the same crate and version otrv4_core uses.
serde_json = "1"
hex = "0.4"
pqcrypto-mldsa = { version = "=0.1.2", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3"
proptest = { version = "1", default-features = false, features = ["std"] }
