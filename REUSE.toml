        "**/*.pro", "**/*.properties", "tests/data/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 muc111"
SPDX-License-Identifier = "AGPL-3.0-only OR LicenseRef-OTRv4Plus-Commercial"

