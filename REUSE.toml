# is added here, which is deliberate.
version = 1

[[annotations]]
path = ["**/*.py", "**/*.rs", "**/*.kt", "**/*.kts", "**/*.toml", "**/*.yml",
        "**/*.sh", "**/*.xml", "**/*.json", "**/*.cfg", "**/*.ini",
        "**/*.pro", "**/*.properties", "tests/data/**", "qubes/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 muc111"
SPDX-License-Identifier = "AGPL-3.0-only OR LicenseRef-OTRv4Plus-Commercial"

